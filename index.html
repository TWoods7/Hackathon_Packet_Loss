<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat AEP</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body class="map-page">
  <nav class="nav">
    <a href="/" class="brand">Chat AEP</a>
  </nav>

  <div class="map-wrap">
    <div id="map" tabindex="-1"></div>
    <div class="map-controls">
      <div class="search-panel">
        <form id="search-form">
          <input id="search-input" type="search" placeholder="Enter an address, street, or area" autocomplete="street-address"
            required />
          <button type="submit">Search</button>
        </form>
        <div id="search-result" hidden></div>
        <button id="open-chat" class="open-chat" type="button" hidden>Back to your conversation &rarr;</button>
      </div>
      <div class="layer-toggles" role="group" aria-label="Map layers">
        <button class="legend-toggle" type="button" data-layer="outages" data-default="on" aria-pressed="true"><span class="dot"
            aria-hidden="true" style="background: rgba(var(--map-hull-fill)); border: 2px solid rgb(var(--map-hull-outline))"></span>Area without power</button>
        <button class="legend-toggle" type="button" data-layer="damage" aria-pressed="false"><span class="dot ring"
            aria-hidden="true" style="border-color: rgb(var(--map-damage))"></span>Damaged equipment</button>
      </div>
      <section id="hull-panel" class="hull-panel" aria-hidden="true" inert aria-labelledby="hull-panel-title">
        <div class="hull-panel-inner">
          <div class="hull-panel-card">
            <header class="hull-panel-header">
              <h2 id="hull-panel-title"></h2>
              <button id="hull-panel-close" type="button" aria-label="Close boundary details">&times;</button>
            </header>
            <p id="hull-panel-text"></p>
          </div>
        </div>
      </section>
      <div class="legend">
        <strong>Outages</strong>
        <div id="customer-count">Loading…</div>
      </div>
    </div>
    <!-- Changing text sits above the controls: the panel is pinned to the
         bottom of the map, so it grows upward and the sliders never move. -->
    <section class="storm-panel" aria-labelledby="storm-title">
      <div class="storm-text">
        <p id="storm-summary" aria-live="polite"></p>
        <div id="heat-legend" hidden>
          <div class="heat-bar"></div>
          <div class="storm-scale"><span>Few hours</span><span>Expected hours without power</span><span>2+ days</span></div>
        </div>
        <p id="storm-assumptions" class="simulation-note"></p>
      </div>
      <div class="storm-controls">
        <div class="storm-header">
          <label id="storm-title" for="storm-severity">Storm strength</label>
          <output id="storm-value" for="storm-severity">Calm</output>
        </div>
        <input id="storm-severity" type="range" min="0" max="9" step="1" value="0" autocomplete="off" />
        <div class="storm-scale"><span>Calm</span><span>Thunderstorm</span><span>Helene</span><span>Feb 2025</span></div>
        <div class="repair-conditions">
          <div class="storm-header">
            <label for="repair-crews">Repair crews</label>
            <output id="crews-value" for="repair-crews">110 crews</output>
          </div>
          <input id="repair-crews" type="range" min="20" max="200" step="10" value="110" autocomplete="off" />
          <label class="roads-blocked"><input id="roads-blocked" type="checkbox" autocomplete="off" />Roads blocked
            (fallen trees, flooding)</label>
        </div>
      </div>
    </section>
    <!-- Full-page assistant. Searching a location opens it over the map; the map
         stays loaded underneath so the assistant's tools can keep using it. -->
    <section id="chatbot" class="chat-view" aria-label="Outage assistant" hidden>
      <header class="chat-view-bar">
        <button class="back-to-map" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          Back to map
        </button>
        <strong>Outage Assistant</strong>
        <button class="alerts-button" type="button">🔔 Preview my alerts</button>
        <button class="person-button" type="button">🙋 Talk to a person</button>
      </header>
      <div class="chatbot-messages" aria-live="polite"></div>
      <form class="chatbot-form">
        <input class="chatbot-input" type="text" placeholder="Ask a follow-up question…" autocomplete="off"
          required />
        <button type="submit">Send</button>
      </form>
    </section>
  </div>

  <script type="module" src="/src/map.js"></script>
  <script type="module" src="/src/chatbot.js"></script>
</body>

</html>
