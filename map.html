<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map · Packet Loss</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="map-page">
    <nav class="nav">
      <a href="/" class="brand">Packet Loss</a>
      <div class="links">
        <a href="/">Home</a>
        <a href="/map.html" class="active">Map</a>
      </div>
    </nav>

    <div class="map-wrap">
      <div id="map"></div>
      <div class="search-panel">
        <form id="search-form">
          <input id="search-input" type="search" placeholder="Enter your home address" autocomplete="street-address" required />
          <button type="submit">Search</button>
        </form>
        <div id="search-result" hidden></div>
      </div>
      <div class="legend">
        <strong>Customers</strong>
        <div id="customer-count">Loading…</div>
        <div><span class="dot" style="background: rgb(var(--map-overhead))"></span>Overhead</div>
        <div><span class="dot" style="background: rgb(var(--map-underground))"></span>Underground</div>
        <div><span class="dot" style="background: rgb(var(--map-unknown))"></span>Unknown</div>
        <div><span class="dot" style="background: rgb(var(--map-life-support))"></span>Life support</div>
        <div><span class="dot ring" style="border-color: rgb(var(--map-nearest))"></span>Nearest to you</div>
      </div>
    </div>

    <script type="module" src="/src/map.js"></script>
  </body>
</html>
