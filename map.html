<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map · Packet Loss</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="map-page">

      <div class="links">

      <div id="map"></div>
